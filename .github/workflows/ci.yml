name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run anchor-distill isolation check

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: anchor-distill:${{ github.sha }}
          outputs: type=oci,dest=/tmp/anchor-distill.tar
      - uses: anchore/sbom-action@v0
        with:
          image: /tmp/anchor-distill.tar
          artifact-name: anchor-distill.spdx.json
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          input: /tmp/anchor-distill.tar
          severity: CRITICAL,HIGH
          exit-code: "1"
